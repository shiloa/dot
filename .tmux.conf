# Use something easier to type as the prefix.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# set scroll history to 10,000 lines
set-option -g history-limit 10000

set-option -g xterm-keys on

# modern encoding and colors
set-option -g default-terminal "tmux-256color"

# set default fish
# set-option -g default-command "reattach-to-user-namespace -l zsh"
# set-option -g default-shell "/bin/zsh"
set-option -g default-command "reattach-to-user-namespace -l fish"
set-option -g default-shell "/opt/homebrew/bin/fish"

# Set the background color on the window
set -g window-style 'bg=#1c1c1c'
set -g window-active-style 'bg=#1c1c1c'

# Relax!
set -sg escape-time 0
set -sg repeat-time 600

# Mouse
set -g mouse on
# set -g mouse-select-pane
# set -g mouse-select-window

# Less stretching to get to the first item.
set -g base-index 1
setw -g pane-base-index 1

# Reload the config.
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# Saner splitting.
bind v split-window -h -c '#{pane_current_path}'
bind s split-window -v -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind S set-option -gF mode-style "fg=#{E:@window-tab-fg},bg=#{E:@window-tab-bg},bold" \; choose-session

# Pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# DVTM style pane selection
bind 1 select-pane -t 1
bind 2 select-pane -t 2
bind 3 select-pane -t 3
bind 4 select-pane -t 4
bind 5 select-pane -t 5
bind 6 select-pane -t 6
bind 7 select-pane -t 7
bind 8 select-pane -t 8
bind 9 select-pane -t 9

# Layouts
set -g main-pane-width 260
bind M select-layout main-vertical
bind E select-layout even-horizontal

# Pane resizing
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# Window movement
# Only really makes sense if you have your parens bound to shifts like me.
bind -r ( select-window -t :-
bind -r ) select-window -t :+
bind-key -r H swap-window -t -1
bind-key -r L swap-window -t +1
bind m command-prompt "move-window -t %%"

# Bad Wolf
set -g status-fg white
set -g status-bg colour234
# set -g window-status-activity-attr bold
# set -g pane-border-fg colour245
# set -g pane-active-border-fg colour39
# set -g message-fg colour16
# set -g message-bg colour221
# set -g message-attr bold

# Custom status bar
# Powerline symbols:
set -g status-left-length 32
set -g status-right-length 150
set -g status-interval 5

set -g status-left '#[fg=colour16,bg=colour254,bold] #S '

set -g status-right "#[fg=colour245] | #(date -u +%%H:%%M) UTC | %d %b #[fg=colour254,bg=colour234,nobold]#(rdio-current-track-tmux) | #[fg=colour16,bg=colour254,bold] #h "

set -g @window-tab-bg '#{?#{==:#{window_index},1},colour254,#{?#{==:#{window_index},2},colour250,#{?#{==:#{window_index},3},colour151,#{?#{==:#{window_index},4},colour180,#{?#{==:#{window_index},5},colour104,#{?#{==:#{window_index},6},colour73,#{?#{==:#{window_index},7},colour67,#{?#{==:#{window_index},8},colour107,#{?#{==:#{window_index},9},colour39,#{?#{==:#{window_index},10},colour131,#{?#{==:#{window_index},11},colour222,#{?#{==:#{window_index},12},colour116,#{?#{==:#{window_index},13},colour186,#{?#{==:#{window_index},14},colour97,#{?#{==:#{window_index},15},colour159,#{?#{==:#{window_index},16},colour215,#{?#{==:#{window_index},17},colour60,#{?#{==:#{window_index},18},colour121,#{?#{==:#{window_index},19},colour224,#{?#{==:#{window_index},20},colour88,colour234}}}}}}}}}}}}}}}}}}}}'
set -g @window-tab-fg '#{?#{==:#{window_index},5},colour254,#{?#{==:#{window_index},10},colour254,#{?#{==:#{window_index},14},colour254,#{?#{==:#{window_index},17},colour254,#{?#{==:#{window_index},20},colour254,colour16}}}}}'
set -g @window-alerts ''

set -g window-status-format "#[fg=#{E:@window-tab-fg},bg=#{E:@window-tab-bg}] #{?#{m:*|#{window_id}|*,#{@window-alerts}},🔔 ,}#I #W #[fg=white,bg=colour234]"
set -g window-status-current-format "#[fg=#{E:@window-tab-fg},bg=#{E:@window-tab-bg},bold] | #I | #W #[fg=white,bg=colour234,nobold]"

set -g mode-style "fg=colour16,bg=colour39,bold"
bind w set-option -gF mode-style "fg=#{E:@window-tab-fg},bg=#{E:@window-tab-bg},bold" \; choose-tree -Zw

set -g pane-border-status top
set -g pane-border-format "#[fg=colour245,bg=#1c1c1c] #{?#{&&:#{>:#{window_panes},1},#{pane_unseen_changes}},🔔 ,}#P: #{pane_current_command} "

# Activity
setw -g monitor-activity on
set -g window-status-activity-style none
set-hook -g alert-activity 'set-option -agF @window-alerts "|#{hook_window}|"'
set-hook -g after-select-window 'set-option -gF @window-alerts "#{s/\\|#{window_id}\\|//:#{@window-alerts}}"'
set -g visual-activity off

# Autorename sanely.
setw -g automatic-rename on

# Better name management
bind c new-window
bind , command-prompt "rename-window '%%'"
bind > run-shell "tmux rename-window `basename #{pane_current_path}`"

# Use vim keybindings in copy mode
setw -g mode-keys vi

# Setup 'v' to begin selection as in Vim
# (note: need to run "brew install reattach-to-user-namespace" for this to work)
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'V' send -X select-line
bind-key -T copy-mode-vi 'r' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"

# Update default binding of `Enter` to also use copy-pipe
unbind -T copy-mode-vi Enter
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"

# backtick activates copy mode
bind ` copy-mode

# esc should cancel copy-mode
bind -T copy-mode-vi Escape send -X cancel

# allow scrolling
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

bind -n WheelDownPane select-pane -t= \; send-keys -M

###########
# PLUGINS #
###########

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# persist tmux sessions across reboots
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# not required but in case you want to customize the resurrect key-bindings
set -g @resurrect-save 'S'
set -g @resurrect-restore 'L'

# Save pane contents and running commands so restored sessions keep useful context.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes ':all:'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TMUX plugin manager (keep this line at the very bottom).
run '~/.tmux/plugins/tpm/tpm'
