# Starship Configuration
# "Clean & Minimal"

add_newline = true

# STRICT FORMAT: Only show Directory -> Git -> Prompt. 
# This disables all language detection (Java, Node, etc) and timers.
format = "$directory$git_branch$git_status$line_break$character"

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"

[directory]
truncation_length = 0    # 0 = Never truncate (Show full path)
truncate_to_repo = false # False = Show full path even inside git repos
style = "bold cyan"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold red"
conflicted = "🏳"
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
up_to_date = ""          # Empty = show nothing when clean (Silent)
untracked = "?"
stashed = "📦"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"
